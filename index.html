<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kasir Toko</title>

<style>

body{
font-family:Arial;
margin:0;
background:#ecf0f1;
}

.header{
background:#34495e;
color:white;
padding:15px;
text-align:center;
font-size:22px;
}

.container{
display:flex;
height:90vh;
}

/* daftar barang */

.barang{
width:55%;
background:white;
padding:10px;
overflow:auto;
}

.search{
width:95%;
padding:10px;
font-size:16px;
margin-bottom:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.btnBarang{
background:#3498db;
color:white;
border:none;
padding:20px;
font-size:18px;
border-radius:10px;
cursor:pointer;
}

.btnBarang:hover{
background:#2980b9;
}

/* keranjang */

.keranjang{
width:45%;
background:#fafafa;
padding:10px;
}

table{
width:100%;
border-collapse:collapse;
}

td{
padding:6px;
border-bottom:1px solid #ddd;
}

.hapus{
color:red;
cursor:pointer;
}

.total{
font-size:22px;
margin-top:10px;
}

input{
width:95%;
padding:10px;
font-size:18px;
margin-top:5px;
}

.btnBayar{
background:#27ae60;
color:white;
border:none;
padding:15px;
font-size:20px;
width:100%;
margin-top:10px;
border-radius:10px;
cursor:pointer;
}

.btnReset{
background:#e74c3c;
color:white;
border:none;
padding:10px;
font-size:16px;
width:100%;
margin-top:10px;
border-radius:10px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">
KASIR TOKO SEMBAKO
</div>

<div class="container">

<!-- daftar barang -->

<div class="barang">

<input type="text" id="cari" class="search" placeholder="Cari barang...">

<div class="grid" id="listBarang"></div>

</div>

<!-- keranjang -->

<div class="keranjang">

<h3>Keranjang</h3>

<table id="tabelKeranjang"></table>

<div class="total">
Total : Rp <span id="total">0</span>
</div>

<label>Bayar</label>
<input type="number" id="bayar">

<div class="total">
Kembali : Rp <span id="kembali">0</span>
</div>

<button class="btnBayar" onclick="bayar()">BAYAR</button>

<button class="btnReset" onclick="resetTransaksi()">RESET</button>

</div>

</div>

<script>

let barang=[
{nama:"Gula 1kg",harga:16000},
{nama:"Minyak Goreng",harga:18000},
{nama:"Telur 1kg",harga:28000},
{nama:"Beras 5kg",harga:70000},
{nama:"Mie Instan",harga:3500},
{nama:"Kopi Sachet",harga:2000},
{nama:"Teh Celup",harga:5000},
{nama:"Sabun Mandi",harga:3000}
];

let keranjang=[];

function tampilBarang(filter=""){

let html="";

barang.forEach((b,i)=>{

if(b.nama.toLowerCase().includes(filter.toLowerCase())){

html+=`
<button class="btnBarang" onclick="tambahBarang(${i})">
${b.nama}<br>
Rp ${b.harga}
</button>
`;

}

});

document.getElementById("listBarang").innerHTML=html;

}

function tambahBarang(i){

keranjang.push(barang[i]);

tampilKeranjang();

}

function tampilKeranjang(){

let html="";
let total=0;

keranjang.forEach((k,i)=>{

html+=`
<tr>
<td>${k.nama}</td>
<td>Rp ${k.harga}</td>
<td class="hapus" onclick="hapusItem(${i})">❌</td>
</tr>
`;

total+=k.harga;

});

document.getElementById("tabelKeranjang").innerHTML=html;
document.getElementById("total").innerText=total;

}

function hapusItem(i){

keranjang.splice(i,1);

tampilKeranjang();

}

document.getElementById("bayar").addEventListener("input",function(){

let bayar=this.value;
let total=parseInt(document.getElementById("total").innerText);

let kembali=bayar-total;

document.getElementById("kembali").innerText=kembali;

});

function bayar(){

alert("Transaksi berhasil");

resetTransaksi();

}

function resetTransaksi(){

keranjang=[];
tampilKeranjang();

document.getElementById("bayar").value="";
document.getElementById("kembali").innerText=0;

}

document.getElementById("cari").addEventListener("input",function(){

tampilBarang(this.value);

});

tampilBarang();

</script>

</body>
</html>
