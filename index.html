<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Aplikasi Kasir Toko</title>

<style>

body{
font-family:Arial;
margin:0;
background:#ecf0f1;
}

/* header */

.header{
background:#2c3e50;
color:white;
padding:15px;
text-align:center;
font-size:22px;
}

/* menu */

.menu{
display:flex;
background:#34495e;
}

.menu button{
flex:1;
padding:15px;
border:none;
background:#34495e;
color:white;
font-size:16px;
}

.menu button:hover{
background:#2c3e50;
}

.container{
padding:15px;
}

/* grid barang */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:20px;
}

.btnBarang{
background:#3498db;
color:white;
border:none;
padding:20px;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

/* table */

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td,th{
padding:8px;
border-bottom:1px solid #ddd;
}

/* input */

input{
padding:10px;
font-size:16px;
margin:5px 0;
width:100%;
}

/* tombol */

.btnHijau{
background:#27ae60;
color:white;
border:none;
padding:12px;
width:100%;
margin-top:10px;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">
KASIR TOKO SEMBAKO
</div>

<div class="menu">
<button onclick="menu('kasir')">Kasir</button>
<button onclick="menu('barang')">Barang</button>
<button onclick="menu('laporan')">Laporan</button>
</div>

<!-- HALAMAN KASIR -->

<div class="container" id="kasir">

<h3>Daftar Barang</h3>

<div class="grid" id="listBarang"></div>

<h3>Keranjang</h3>

<table>
<thead>
<tr>
<th>Barang</th>
<th>Harga</th>
</tr>
</thead>
<tbody id="tabelKeranjang"></tbody>
</table>

<h3>Total : Rp <span id="total">0</span></h3>

Bayar
<input type="number" id="bayar">

<h3>Kembali : Rp <span id="kembali">0</span></h3>

<button class="btnHijau" onclick="bayar()">BAYAR</button>

</div>

<!-- HALAMAN BARANG -->

<div class="container" id="barang" style="display:none">

<h3>Tambah Barang</h3>

<input id="namaBarang" placeholder="Nama Barang">
<input id="hargaBarang" placeholder="Harga">
<input id="stokBarang" placeholder="Stok">

<button class="btnHijau" onclick="tambahBarang()">Simpan Barang</button>

<h3>Data Barang</h3>

<table>
<thead>
<tr>
<th>Nama</th>
<th>Harga</th>
<th>Stok</th>
</tr>
</thead>

<tbody id="tabelBarang"></tbody>

</table>

</div>

<!-- HALAMAN LAPORAN -->

<div class="container" id="laporan" style="display:none">

<h3>Laporan Penjualan</h3>

Total Transaksi : <span id="jumlahTransaksi">0</span>

<br><br>

Total Omzet : Rp <span id="totalOmzet">0</span>

<h3>Riwayat Transaksi</h3>

<table>

<thead>
<tr>
<th>Tanggal</th>
<th>Total</th>
</tr>
</thead>

<tbody id="tabelLaporan"></tbody>

</table>

</div>

<script>

/* DATA BARANG */

let barang = JSON.parse(localStorage.getItem("barang")) || [
{nama:"Gula 1kg",harga:16000,stok:20},
{nama:"Minyak Goreng",harga:18000,stok:15}
];

let transaksi = JSON.parse(localStorage.getItem("transaksi")) || [];

let keranjang=[];

/* SIMPAN DATA */

function simpanBarang(){
localStorage.setItem("barang",JSON.stringify(barang));
}

function simpanTransaksi(data){

transaksi.push(data);

localStorage.setItem("transaksi",JSON.stringify(transaksi));

}

/* TAMPIL BARANG */

function tampilBarang(){

let html="";

barang.forEach((b,i)=>{

html+=`
<button class="btnBarang" onclick="tambahKeranjang(${i})">
${b.nama}<br>
Rp ${b.harga}<br>
Stok:${b.stok}
</button>
`;

});

document.getElementById("listBarang").innerHTML=html;

}

/* TAMPIL DATA BARANG */

function tampilDataBarang(){

let html="";

barang.forEach((b)=>{

html+=`
<tr>
<td>${b.nama}</td>
<td>${b.harga}</td>
<td>${b.stok}</td>
</tr>
`;

});

document.getElementById("tabelBarang").innerHTML=html;

}

/* TAMBAH BARANG */

function tambahBarang(){

let nama=document.getElementById("namaBarang").value;
let harga=document.getElementById("hargaBarang").value;
let stok=document.getElementById("stokBarang").value;

barang.push({
nama:nama,
harga:parseInt(harga),
stok:parseInt(stok)
});

simpanBarang();

tampilBarang();
tampilDataBarang();

}

/* TAMBAH KERANJANG */

function tambahKeranjang(i){

if(barang[i].stok<=0){

alert("Stok habis");

return;

}

keranjang.push(i);

tampilKeranjang();

}

/* TAMPIL KERANJANG */

function tampilKeranjang(){

let html="";
let total=0;

keranjang.forEach(i=>{

let b=barang[i];

html+=`
<tr>
<td>${b.nama}</td>
<td>${b.harga}</td>
</tr>
`;

total+=b.harga;

});

document.getElementById("tabelKeranjang").innerHTML=html;
document.getElementById("total").innerText=total;

}

/* HITUNG KEMBALIAN */

document.getElementById("bayar").addEventListener("input",function(){

let bayar=this.value;

let total=parseInt(document.getElementById("total").innerText);

document.getElementById("kembali").innerText=bayar-total;

});

/* BAYAR */

function bayar(){

let total=parseInt(document.getElementById("total").innerText);

let data={
tanggal:new Date().toLocaleString(),
total:total
};

simpanTransaksi(data);

keranjang.forEach(i=>{
barang[i].stok--;
});

simpanBarang();

alert("Transaksi sukses");

keranjang=[];

tampilKeranjang();
tampilBarang();
tampilDataBarang();
tampilLaporan();

}

/* TAMPIL LAPORAN */

function tampilLaporan(){

let html="";
let omzet=0;

transaksi.forEach(t=>{

html+=`
<tr>
<td>${t.tanggal}</td>
<td>Rp ${t.total}</td>
</tr>
`;

omzet+=t.total;

});

document.getElementById("tabelLaporan").innerHTML=html;
document.getElementById("jumlahTransaksi").innerText=transaksi.length;
document.getElementById("totalOmzet").innerText=omzet;

}

/* MENU */

function menu(m){

document.getElementById("kasir").style.display="none";
document.getElementById("barang").style.display="none";
document.getElementById("laporan").style.display="none";

document.getElementById(m).style.display="block";

}

/* LOAD AWAL */

tampilBarang();
tampilDataBarang();
tampilLaporan();

</script>

</body>
</html>
