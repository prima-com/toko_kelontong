<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kasir Toko</title>

<style>

body{
font-family:Arial;
margin:0;
background:#ecf0f1;
}

.header{
background:#2c3e50;
color:white;
padding:15px;
text-align:center;
font-size:22px;
}

.menu{
display:flex;
background:#34495e;
}

.menu button{
flex:1;
padding:15px;
border:none;
background:#34495e;
color:white;
font-size:16px;
}

.menu button:hover{
background:#2c3e50;
}

.container{
padding:10px;
}

/* barang grid */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.btnBarang{
background:#3498db;
color:white;
border:none;
padding:20px;
border-radius:10px;
font-size:16px;
}

/* keranjang */

table{
width:100%;
margin-top:10px;
}

td{
padding:6px;
border-bottom:1px solid #ddd;
}

input{
padding:10px;
font-size:16px;
margin:5px;
width:95%;
}

button{
cursor:pointer;
}

.btnHijau{
background:#27ae60;
color:white;
border:none;
padding:12px;
width:100%;
margin-top:10px;
}

.btnMerah{
background:#e74c3c;
color:white;
border:none;
padding:10px;
width:100%;
}

</style>

</head>

<body>

<div class="header">
KASIR TOKO
</div>

<div class="menu">
<button onclick="menu('kasir')">Kasir</button>
<button onclick="menu('barang')">Barang</button>
</div>

<div class="container" id="kasir">

<h3>Daftar Barang</h3>

<div class="grid" id="listBarang"></div>

<h3>Keranjang</h3>

<table id="tabelKeranjang"></table>

Total : Rp <span id="total">0</span>

<br><br>

Bayar
<input type="number" id="bayar">

Kembali : Rp <span id="kembali">0</span>

<button class="btnHijau" onclick="bayar()">BAYAR</button>

</div>

<!-- halaman barang -->

<div class="container" id="barang" style="display:none">

<h3>Tambah Barang</h3>

<input id="namaBarang" placeholder="Nama Barang">
<input id="hargaBarang" placeholder="Harga">
<input id="stokBarang" placeholder="Stok">

<button class="btnHijau" onclick="tambahBarang()">Simpan</button>

<h3>Data Barang</h3>

<table id="tabelBarang"></table>

</div>

<script>

let barang=JSON.parse(localStorage.getItem("barang"))||[
{nama:"Gula 1kg",harga:16000,stok:20},
{nama:"Minyak Goreng",harga:18000,stok:15}
];

let keranjang=[];

function simpanBarang(){

localStorage.setItem("barang",JSON.stringify(barang));

}

function tampilBarang(){

let html="";

barang.forEach((b,i)=>{

html+=`
<button class="btnBarang" onclick="tambahKeranjang(${i})">
${b.nama}<br>
Rp ${b.harga}<br>
Stok:${b.stok}
</button>
`;

});

document.getElementById("listBarang").innerHTML=html;

}

function tampilDataBarang(){

let html="";

barang.forEach((b,i)=>{

html+=`
<tr>
<td>${b.nama}</td>
<td>${b.harga}</td>
<td>${b.stok}</td>
</tr>
`;

});

document.getElementById("tabelBarang").innerHTML=html;

}

function tambahBarang(){

let nama=document.getElementById("namaBarang").value;
let harga=document.getElementById("hargaBarang").value;
let stok=document.getElementById("stokBarang").value;

barang.push({nama:nama,harga:parseInt(harga),stok:parseInt(stok)});

simpanBarang();

tampilBarang();
tampilDataBarang();

}

function tambahKeranjang(i){

if(barang[i].stok<=0){

alert("Stok habis");

return;

}

keranjang.push(i);

tampilKeranjang();

}

function tampilKeranjang(){

let html="";
let total=0;

keranjang.forEach((i,index)=>{

let b=barang[i];

html+=`
<tr>
<td>${b.nama}</td>
<td>${b.harga}</td>
</tr>
`;

total+=b.harga;

});

document.getElementById("tabelKeranjang").innerHTML=html;
document.getElementById("total").innerText=total;

}

document.getElementById("bayar").addEventListener("input",function(){

let bayar=this.value;
let total=parseInt(document.getElementById("total").innerText);

document.getElementById("kembali").innerText=bayar-total;

});

function bayar(){

keranjang.forEach(i=>{

barang[i].stok--;

});

simpanBarang();

alert("Transaksi sukses");

keranjang=[];

tampilKeranjang();
tampilBarang();
tampilDataBarang();

}

function menu(m){

document.getElementById("kasir").style.display="none";
document.getElementById("barang").style.display="none";

document.getElementById(m).style.display="block";

}

tampilBarang();
tampilDataBarang();

</script>

</body>
</html>
